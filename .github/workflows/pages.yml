# Deploys the app to GitHub Pages at https://btotl.github.io/bluestar/
#
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
# Runs on pushes to main and to claude/* branches, and on demand.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build
        # Hash routing, so the site needs no rewrites. The on-device portrait
        # model loads from img.ly's CDN at run time (see docs/birth-portrait.md).
        run: npx vite build --base /bluestar/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
